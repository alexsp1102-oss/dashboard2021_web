<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Ejecutivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.6);
        }
        .card {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            backdrop-filter: blur(5px);
        }
        .card-title {
            color: #fff;
        }
        .btn {
            font-weight: 600;
        }
        .btn-primary { background-color: #007bff; border: none; }
        .btn-success { background-color: #28a745; border: none; }
        .btn-warning { background-color: #ffc107; border: none; color: #000; }
        .btn-info { background-color: #17a2b8; border: none; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Dashboard Ejecutivo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/inicio/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reportes/mensual/">Reporte mensual</a></li>
                    <li class="nav-item"><a class="nav-link" href="/exportar/excel/">Exportar Excel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/comparativo/">Comparativo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container text-center mt-5">
        <h1 class="fw-bold">Bienvenido al Dashboard</h1>
        <p class="lead">Has iniciado sesión correctamente.</p>

        <div class="row justify-content-center mt-4">
            <div class="col-md-8">
                <div class="card shadow-lg p-4">
                    <h5 class="card-title mb-4">Accesos rápidos</h5>
                    <div class="d-grid gap-3">
                        <a href="/inicio/" class="btn btn-primary">Inicio</a>
                        <a href="/reportes/mensual/" class="btn btn-success">Reporte mensual</a>
                        <a href="/exportar/excel/" class="btn btn-warning">Exportar Excel</a>
                        <a href="/comparativo/" class="btn btn-info">Comparativo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
