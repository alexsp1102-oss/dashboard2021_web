{% extends 'base.html' %}
{% block title %}Sucursales{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Ventas por Sucursal</h2>

  <!-- Botón Top Sucursales -->
  <div class="mb-3">
    <button onclick="window.location.href='{% url 'top_sucursales' %}'" class="btn btn-success">
      Top Sucursales
    </button>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Ciudad</th>
        <th>Provincia</th>
        <th>Ventas</th>
      </tr>
    </thead>
    <tbody>
      {% for s in sucursales %}
      <tr>
        <td>{{ s.Ciudad }}</td>
        <td>{{ s.Provincia }}</td>
        <td>{{ s.Ventas|floatformat:2 }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" class="text-center text-muted">No hay datos disponibles.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
